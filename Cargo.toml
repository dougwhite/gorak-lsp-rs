[package]
name = "gorak-lsp-rs"
version = "0.9.0-alpha.5"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
repository = "https://github.com/dougwhite/gorak-lsp-rs"
default-run = "gorak-lsp-rs"
description = "Native OpenROAD language analysis for gorak workspaces"

[dependencies]
anyhow = "1"
postcard = { version = "1", features = ["use-std"] }
blake3 = "1"
crossbeam-channel = "0.5"
lsp-server = "0.7"
roxmltree = "0.20"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
url = "2"
percent-encoding = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
debug = 0

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
